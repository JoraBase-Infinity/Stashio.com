name: Build Android APK (Poysha POS)

# কখন এই workflow চলবে:
# ১. main ব্রাঞ্চে কোনো কোড পুশ হলে
# ২. GitHub-এর "Actions" ট্যাব থেকে "Run workflow" বাটনে চাপ দিলে (workflow_dispatch)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরির কোড চেকআউট করা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. Java (JDK 17) সেটআপ করা
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ৩. Firebase google-services.json ইনজেক্ট করা (যদি GitHub Secret সেট করা থাকে)
      - name: Setup Firebase Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Injecting google-services.json from GitHub Secrets..."
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      # ৪. Gradle wrapper-কে এক্সিকিউটেবল পারমিশন দেওয়া
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ৫. Native Android Debug APK বিল্ড করা
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      # ৬. তৈরি হওয়া APK ফাইলটি GitHub Actions-এর "Artifacts" সেকশনে আপলোড করা
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poysha-POS-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
